[project]
name = "snds-worker"
version = "0.0.1"
description = "Short-lived SNDS worker: environment readiness, model acquisition, and offline separation."
license = "MIT"
requires-python = "==3.11.*"
dependencies = [
    "beat-this==1.1.0",
    "demucs==4.0.1",
    # The Torch 2.1.2 wheels are built against NumPy 1.x.
    "numpy==1.26.4",
    # Torch 2.1.2 compares versions through packaging without declaring it.
    "packaging==25.0",
    # TorchAudio on Windows has no working WAV backend without SoundFile.
    "soundfile==0.12.1",
]

# Select exactly one: they choose the PyTorch build through [tool.uv.sources].
[project.optional-dependencies]
cpu = ["torch==2.1.2", "torchaudio==2.1.2"]
cuda = ["torch==2.1.2", "torchaudio==2.1.2"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[build-system]
requires = ["uv_build==0.12.1"]
build-backend = "uv_build"

[tool.uv]
# Windows 11 x64 is the supported platform, and the CUDA wheels exist only for some platforms.
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
# Demucs requires torch and torchaudio without an upper bound. Keep every resolution, including
# a sync without an extra, on the pinned versions.
constraint-dependencies = ["torch==2.1.2", "torchaudio==2.1.2"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu121", extra = "cuda" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu121", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
