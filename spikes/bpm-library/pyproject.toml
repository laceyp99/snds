[project]
name = "snds-bpm-library-spike"
version = "0.0.0"
description = "Disposable BPM analyzer comparison spike beside the pinned SNDS separation stack."
requires-python = "==3.11.*"
dependencies = [
    "demucs==4.0.1",
    "numpy==1.26.4",
    "packaging==25.0",
    "soundfile==0.12.1",
    "torch==2.1.2",
    "torchaudio==2.1.2",
]

# Candidates that install from wheels on Windows x64 / CPython 3.11 without
# changing the separation pins. The in-house baseline needs only NumPy.
[dependency-groups]
librosa = ["librosa==0.11.0"]
deeprhythm = ["deeprhythm==0.0.13"]
beat-this = ["beat-this==1.1.0"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
